---
- name: Skills | Ensure ~/.copilot directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.copilot"
    state: directory
    mode: "0700"

- name: Skills | Create symlink to skills directory
  ansible.builtin.file:
    src: "{{ role_path }}/files"
    dest: "{{ ansible_facts['user_dir'] }}/.copilot/skills"
    state: link
    force: true
  become: true
