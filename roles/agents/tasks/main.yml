---
- name: Agents | Ensure ~/.copilot directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.copilot"
    state: directory
    mode: "0700"

- name: Agents | Create symlink to agents directory
  ansible.builtin.file:
    src: "{{ role_path }}/files"
    dest: "{{ ansible_facts['user_dir'] }}/.copilot/agents"
    state: link
    force: true
  become: true
