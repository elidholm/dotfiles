# General setting
set -g prefix C-a
unbind C-b
bind a last-window
bind C-a send-prefix

# Improve split-window commands
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Reload tmux config
unbind R
bind R source-file ~/.tmux.conf\; display-message "Config reloaded!"

# Rename window
unbind r
bind r command-prompt "rename-window %%"

# Command prompt
unbind :
bind : command-prompt

# Resize panes with hjkl
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z # Toggle maximize pane

# Navigate windows
bind p previous-window
bind C-p previous-window
bind C-n next-window

# Enable vi mode for copy and selection
setw -g mode-keys vi

# Vi-style copy-mode bindings for easy text selection
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection
bind P paste-buffer
set -g @yank_action 'copy-pipe'
set -g @yank_selection_mouse 'clipboard'

# Enable mouse support and history scrolling
set -g mouse on
set -g history-limit 1000000

# Pane and window indexing start at 1
set -g base-index 1
setw -g pane-base-index 1

# Miscellanous options
set -s escape-time 0
setw -g aggressive-resize on
set -g renumber-windows on
set -g focus-events on
set -g display-time 4000
set -g status-interval 5
set-option -g status-position 'top'
set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'
set -g default-terminal "$TERM"
set -g detach-on-destroy off
set -g set-clipboard on
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# Plugins (TPM: tmux plugin manager)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'     # Sensible defaults
set -g @plugin 'tmux-plugins/tmux-yank'         # System clipboard integration
set -g @plugin 'tmux-plugins/tmux-open'         # Open links/files from terminal
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Persist tmux session
set -g @plugin 'tmux-plugins/tmux-continuum'    # Auto-save sessions
set -g @plugin 'christoomey/vim-tmux-navigator' # Vim-style pane navigation
set -g @plugin 'catppuccin/tmux'                # Catppuccin theme
set -g @plugin 'fcsonline/tmux-thumbs'          # Copy and paste easily with vim bindings
set -g @plugin 'sainnhe/tmux-fzf'               # Fuzzy finder integration
set -g @plugin 'wfxr/tmux-fzf-url'              # Fuzzy finder for URLs
set -g @plugin 'omerxx/tmux-sessionx'           # Session management
set -g @plugin 'omerxx/tmux-floax'              # Floating windows


# Resurrect and Continuum configuration
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Yank with mouse support
set -g @yank_with_mouse on

# FZF configuration
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# Floax configuration
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 't'
set -g @floax-change-path 'true'

# Sessionx configuration
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-custom-paths '/home/elidholm/.dotfiles'
set -g @sessionx-bind 'o'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'

# Catppuccin theme configuration
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"

# Load catppuccin
run ~/.tmux/plugins/tmux/catppuccin.tmux

# Catppuccin v2 modules must be assigned explicitly after loading the theme.
# Layout: (session)(windows...)                         (directory)
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"

# TPM plugin initialization (Keep this at the bottom)
run '~/.tmux/plugins/tpm/tpm'
