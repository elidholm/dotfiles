---
- name: Logs | Ensure update script log directory exists
  ansible.builtin.file:
    path: /var/log/update
    state: directory
    owner: "{{ host_user }}"
    group: "{{ host_user }}"
    mode: '0755'
  become: true

- name: Logs | Ensure update script log files exist
  ansible.builtin.file:
    path: "{{ log_file }}"
    state: touch
    modification_time: preserve
    access_time: preserve
    owner: "{{ host_user }}"
    group: "{{ host_user }}"
    mode: '0664'
  loop_control:
    loop_var: log_file
  loop:
    - /var/log/update/update.log
    - /var/log/update/update_errors.log
  become: true

- name: Logs | Create logrotation
  ansible.builtin.blockinfile:
    path: /etc/logrotate.d/update
    block: |
      /var/log/update/*.log {
        daily
        missingok
        rotate 7
        compress
        notifempty
        create
      }
    create: true
    mode: '0644'
  become: true
