---
- name: Run Ubuntu Tasks
  ansible.builtin.import_tasks: ubuntu.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: Markdownlint | Ensure config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config"
    state: directory
    mode: "0755"

- name: Markdownlint | Create symlink to config
  ansible.builtin.file:
    src: "{{ role_path }}/files/.markdownlint.yml"
    dest: "{{ ansible_facts['user_dir'] }}/.config/.markdownlint.yml"
    state: link
    force: true
