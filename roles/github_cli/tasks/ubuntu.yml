---
- name: Github CLI | Ubuntu | Add Github’s official GPG key
  ansible.builtin.apt_key:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    keyring: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    state: present
  become: true

- name: Github CLI | Ubuntu | Add Github's stable repository
  ansible.builtin.apt_repository:
    repo: |
      deb [arch={{ dpkg_architecture }} signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main
    mode: "0644"
  become: true

- name: Github CLI | Ubuntu | Install Github CLI
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true
  become: true
